spring:
  application:
    name: jchatmind
  datasource:
    url: jdbc:postgresql://localhost:5433/jchatmind
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  mail:
    host: smtp.qq.com
    port: 587
    username: your-email
    password: your-password # 邮箱授权码
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  ai:
    deepseek:
      api-key: your-api-key
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
    zhipuai:
      api-key: your-api-key
      base-url: https://open.bigmodel.cn/api/paas
      chat:
        options:
          model: glm-4.6
mybatis:
  type-aliases-package: com.kama.jchatmind.model.entity
  mapper-locations: classpath:mapper/*.xml
  type-handlers-package: com.kama.jchatmind.typehandler

document:
  storage:
    base-path: ./data/documents

# embedding 服务
# 默认指向本机 Ollama（零外部依赖）；也可以指向任意 OpenAI 兼容端点（自建 / 第三方）
# 具体地址与 Key 放 application-dev.yaml（已被 .gitignore 排除）
app:
  embedding:
    protocol: ollama                     # ollama | openai
    base-url: http://localhost:11434
    model: bge-m3                        # ⚠️ 维度必须与 chunk_bge_m3.embedding vector(1024) 一致
    api-key:                             # 留空则不发送 Authorization 头
  # 检索与切块配置（任务 03）。
  # top-k：每次检索返回的片段数，默认 3，范围 1–10（超出会被夹取）。
  # max-distance：可选的 L2 拒绝阈值，默认留空 = 未启用；没有用开发集校准前不要填值，
  #               未校准时不使用任何“相似度百分比”，也不用 1 - distance 冒充置信度。
  # chunk-*：正文切块预算，单位是 estimated token（保守字符估算：CJK 1 字符≈1，其余 2 字符≈1），
  #          目标 512–800、重叠 64–100，另有 max-chunk-characters 字符硬上限。
  retrieval:
    top-k: 3
    max-distance:
    chunk-target-estimated-tokens: 640
    chunk-overlap-estimated-tokens: 80
    max-chunk-characters: 4096

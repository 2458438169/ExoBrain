name: exobrain
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: exobrain
      POSTGRES_DB: exobrain
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./secrets/db-password:/run/secrets/db-password:ro
      - ./secrets/app-db-password:/run/secrets/app-db-password:ro
      - ./init.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./init-users.sh:/docker-entrypoint-initdb.d/20-users.sh:ro
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=25"]
    mem_limit: 192m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exobrain -d exobrain"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      options:
        max-size: 10m
        max-file: "3"
  app:
    image: exobrain:20261014-accounts
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:18082:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/run/secrets/application-prod.yaml
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/exobrain
      SPRING_DATASOURCE_USERNAME: exobrain_app
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 20MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 20MB
      DOCUMENT_STORAGE_BASE_PATH: /app/data/documents
      APP_AUTH_PUBLIC_ORIGIN: https://exobrain.sharmoon.cc.cd
      APP_AUTH_SECURE_COOKIE: "true"
      APP_AUTH_BOOTSTRAP_ADMIN_USERNAME: admin
      APP_AUTH_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap-admin-password
      APP_MODELS_ENCRYPTION_KEY_FILE: /run/secrets/models-encryption-key
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=48m -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai
    volumes:
      - ./secrets/application-prod.yaml:/run/secrets/application-prod.yaml:ro
      - ./secrets/bootstrap-admin-password:/run/secrets/bootstrap-admin-password:ro
      - ./secrets/models-encryption-key:/run/secrets/models-encryption-key:ro
      - documents:/app/data/documents
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; head -1 <&3 | grep -q '200'"]
      interval: 20s
      timeout: 5s
      start_period: 90s
      retries: 5
    logging:
      options:
        max-size: 10m
        max-file: "3"
volumes:
  pgdata:
  documents:

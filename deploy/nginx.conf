limit_req_zone $binary_remote_addr zone=exobrain_demo_chat:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=exobrain_login:1m rate=10r/m;

server {
    listen 127.0.0.1:8082;
    listen [::1]:8082;
    server_name exobrain.sharmoon.cc.cd;
    root /opt/exobrain/current/ui;
    index index.html;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;
    limit_req_status 429;
    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Nginx and Tomcat normalize matrix parameters differently. Reject them in
    # the path, including nested encoding, before any anonymous route is proxied.
    if ($request_uri ~* "^[^?]*(;|%3b|%5c|%25)") {
        return 400;
    }

    location = /api/auth/login {
        limit_req zone=exobrain_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:18082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /admin/api/auth/login {
        limit_req zone=exobrain_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:18082/api/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/demo/chat-messages {
        limit_req zone=exobrain_demo_chat burst=5 nodelay;
        proxy_pass http://127.0.0.1:18082$uri$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
    location ^~ /api/demo/ {
        # Fail closed for paths outside the explicitly published demo API.
        if ($uri !~ "^/api/demo/(agents|knowledge-bases|tools|chat-sessions(/agent/[0-9a-f-]{36}|/[0-9a-f-]{36})?|chat-messages/session/[0-9a-f-]{36}|documents/kb/[0-9a-f-]{36}|documents/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/content|showcase(/[0-9a-f-]{36})?)$") {
            return 404;
        }
        proxy_pass http://127.0.0.1:18082$uri$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:18082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
    location ^~ /sse/demo/ {
        if ($uri !~ "^/sse/demo/connect/[0-9a-f-]{36}$") {
            return 404;
        }
        proxy_pass http://127.0.0.1:18082$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }
    location /sse/ {
        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }
    location = /admin {
        return 302 /admin/;
    }
    location /admin/api/ {
        proxy_pass http://127.0.0.1:18082/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
    location /admin/sse/ {
        proxy_pass http://127.0.0.1:18082/sse/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }
    location /admin/ {
        root /opt/exobrain/current;
        try_files $uri $uri/ /admin/index.html;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
